name: stand

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate stand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Регрессионная проверка: в комплект не должны попадать артефакты
      # установки с паролем базы и ключом шифрования, а в демо-дампе —
      # таблицы сессий и журнала входов.
      - name: No install secrets in package
        run: |
          cd stand
          if find . -name 'config-internal.php' -o -name 'cache' -type d | grep -q .; then
            echo "::error::в комплекте есть config-internal.php или cache/"
            exit 1
          fi
          if tar -tzf dump/espocrm-data.tar.gz | grep -E 'config-internal\.php|/cache/|\.log$'; then
            echo "::error::в архиве данных есть артефакты установки или логи"
            exit 1
          fi
          if zcat dump/espocrm-demo.sql.gz | grep -q '^INSERT INTO `auth_token`'; then
            echo "::error::в демо-дампе есть сессии auth_token"
            exit 1
          fi
          if zcat dump/espocrm-demo.sql.gz | grep -q '^INSERT INTO `auth_log_record`'; then
            echo "::error::в демо-дампе есть журнал входов"
            exit 1
          fi

      - name: Validate docker compose
        run: |
          cd stand
          cp .env.example .env
          docker compose config -q
          rm -f .env

      - name: Check python syntax
        run: python3 -m py_compile stand/seed_demo.py

      - name: Build package archive
        run: bash stand/pack.sh "$RUNNER_TEMP/accent-crm-stand.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: accent-crm-stand
          path: ${{ runner.temp }}/accent-crm-stand.zip
          if-no-files-found: error
